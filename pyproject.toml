[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngllib"
version = "0.3.0"
description = "RL environment over Neuroglancer with pluggable Chrome and simulator renderers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Seung Lab" }]
keywords = ["neuroglancer", "reinforcement-learning", "connectomics", "playwright", "moderngl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "playwright",
    "numpy",
    "scipy",
    "msgpack",
    "Pillow",
    "gymnasium>=1.0",
    "psutil",
    # Simulator backend (ngllib.simulator): offscreen GL + FlyWire data access.
    # Main dependencies, not an extra -- the imports stay lazy, so a Chrome-only
    # install pays nothing at import time.
    "moderngl>=5.10",
    "cloud-volume>=8.0",
]

[project.urls]
Homepage = "https://github.com/Kev-Park/neurogym"
Repository = "https://github.com/Kev-Park/neurogym"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngllib*"]

[tool.setuptools.package-data]
ngllib = ["config.json"]
